name: sso-continuity-tests

# Runs the offline SSO continuity test suite. It needs no Salesforce credentials and
# no secrets, and it does NOT validate anything against a Salesforce org or an
# identity provider.
on:
  push:
    paths:
      - 'scripts/sso-continuity/**'
      - '.github/workflows/sso-continuity-tests.yml'
  pull_request:
    paths:
      - 'scripts/sso-continuity/**'
      - '.github/workflows/sso-continuity-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    defaults:
      run:
        shell: bash
        working-directory: scripts/sso-continuity
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: |
          set -o pipefail
          echo "runner=$RUNNER_OS node=$(node --version)"
          node --test --test-reporter=tap | tee test-output.txt
      - name: Run the demonstration (expected exit code 2)
        run: |
          set +e
          node src/cli.mjs fixtures/baseline.json fixtures/snapshot.json > demo-output.json
          code=$?
          echo "demo exit code: $code"
          test "$code" -eq 2
      - name: Publish result summary as an annotation
        if: always()
        run: |
          summary=$(grep -E '^# (tests|pass|fail|cancelled|skipped) ' test-output.txt | tr '\n' ' ')
          echo "::notice title=SSO continuity tests::$RUNNER_OS node=$(node --version) ${summary}"
