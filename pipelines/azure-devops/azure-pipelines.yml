# ILLUSTRATIVE EXAMPLE. NOT EXECUTED on Azure DevOps Server or any other CI system.
# Only checked to be syntactically valid YAML. All names are fictional.
#
# This is the pipeline that lives in the PRODUCT repository. A pull request can edit
# this file, so it contains no security logic of its own. It only extends a template
# from a separate, protected repository. See templates/guarded-validate.yml.

trigger:
  branches:
    include:
      - release/*

resources:
  repositories:
    - repository: controls            # protected repository owned by the platform team
      type: git
      name: Platform/PipelineControls
      ref: refs/tags/org-guard-v0     # pinned to a tag, not to a moving branch

extends:
  template: templates/guarded-validate.yml@controls
  parameters:
    environmentName: salesforce-qa    # has a "Required template" check, see the chapter
    policyName: qa                    # selects policies/qa.json inside the controls repository
    targetUsername: ci-user@example-corp.com.qa
